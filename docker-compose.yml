services:
  app:
    build:
      context: .
      target: dev
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    entrypoint: ["sh", "./docker-entrypoint.sh"]
    # Development mode with HMR
    command: ["pnpm", "--config.confirmModulesPurge=false", "--config.strict-dep-builds=false", "--config.verify-deps-before-run=false", "dev", "--host", "0.0.0.0", "--port", "3000"]
    volumes:
      - .:/app:cached
      - app_node_modules:/app/node_modules
      - app_nuxt:/app/.nuxt
    env_file:
      - .env
    environment:
      APP_ROLE: web
      NODE_ENV: development
      CI: "false"
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 25s

  worker:
    image: auto-bankposteringer-nordea-kmdopus-role-runtime
    build:
      context: .
      target: role-runtime
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: "1.0"
    env_file:
      - .env
    environment:
      APP_ROLE: worker
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=${WORKER_NODE_MAX_OLD_SPACE_MB:-768}"
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-4}
      WORKER_MAX_OUTBOX: ${WORKER_MAX_OUTBOX:-20}
      WORKER_IDLE_SLEEP_MS: ${WORKER_IDLE_SLEEP_MS:-1500}
      WORKER_ERROR_SLEEP_MS: ${WORKER_ERROR_SLEEP_MS:-5000}
      WORKER_JOB_COOLDOWN_MS: ${WORKER_JOB_COOLDOWN_MS:-300}
      CI: "true"
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      DB_RESET_ON_START: "0"
      DB_MIGRATE_ON_START: "0"
      DB_SEED_SYSTEM_ON_START: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    command: ["node", "node_modules/tsx/dist/cli.mjs", "--tsconfig", "tsconfig.scripts.json", "scripts/runtime/worker.ts"]
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - app_net

  scheduler:
    image: auto-bankposteringer-nordea-kmdopus-role-runtime
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: "0.75"
    env_file:
      - .env
    environment:
      APP_ROLE: scheduler
      NODE_ENV: production
      CI: "true"
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      DB_RESET_ON_START: "0"
      DB_MIGRATE_ON_START: "0"
      DB_SEED_SYSTEM_ON_START: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    command: ["node", "node_modules/tsx/dist/cli.mjs", "--tsconfig", "tsconfig.scripts.json", "scripts/runtime/scheduler.ts"]
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - app_net

  db:
    image: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - app_net

  sftp:
    image: atmoz/sftp:alpine
    ports:
      - "2223:22"
    # Creates user "test" with password "pass" and two directories inside the chroot:
    #   /test-from-randers
    #   /test-to-randers
    command: "test:pass:1001:100:test-from-randers,test-to-randers"
    networks:
      - app_net

volumes:
  app_node_modules:
  app_nuxt:
  postgres_data:
  keycloak_data:

networks:
  app_net:
    name: auto-bankposteringer-nordea-kmdopus-net