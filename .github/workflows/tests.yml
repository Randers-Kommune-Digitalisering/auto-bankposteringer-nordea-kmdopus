name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: mydb
        options: >-
          --health-cmd "pg_isready -U root -d mydb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # DB
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
      DATABASE_URL: postgres://root:pass@localhost:5432/mydb

      # Dummy values to satisfy strict env parsing during CLI/test imports
      ERP_SUPPLIER: kmd
      ERP_BOOKING_PERIOD_CLOSE_DAY: "7"
      ERP_ERROR_ACCOUNT: "95999999"
      ERP_ACTIVE_INTEGRATION: "false"
      ERP_PROD_ENVIRONMENT: P04
      ERP_MUNICIPALITY_CODE: "730"
      ERP_COMP_CODE: "0020"
      ERP_INTEGRATION_ID: TEST
      ERP_INTEGRATION_FILENAME_MASK: ZFIR_KMD_Opus_Posteringer_IND_{municipalityCode}_{integrationId}_{docDate}_{docTime}.xml
      ERP_PRIMARY_ACCOUNT_LABEL: Artskonto
      ERP_SECONDARY_ACCOUNT_LABEL: Omkostningssted
      ERP_TERTIARY_ACCOUNT_LABEL: PSP-element

      SFTP_URL: sftp://example.invalid
      SFTP_USERNAME: dummy
      SFTP_PASSWORD: dummy
      SFTP_REQUEST_DIR: /data/output/
      SFTP_RESPONSE_DIR: /fra-randers/

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply DB schema (Drizzle)
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

  publish-images:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: prod
            role: web
          - target: role-runtime
            role: runtime
          - target: db-init
            role: db-init

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.role }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}-${{ matrix.role }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
